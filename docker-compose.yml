services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: vuonnho_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: vuonnho_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - vuonnho_network

  # Node.js Express Backend API
  backend:
    build: ./server
    container_name: vuonnho_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: vuonnho_db
      JWT_SECRET: vuon_nho_secret_key_2026_super_secure
    depends_on:
      - db
    networks:
      - vuonnho_network

volumes:
  mysql_data:
    driver: local

networks:
  vuonnho_network:
    driver: bridge
